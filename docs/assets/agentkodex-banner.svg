<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="Agentkodex chat-first control plane for AI coding agents">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#06151a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="520" rx="36" fill="url(#bg)"/>
  <path d="M52 82 H1228" stroke="url(#line)" stroke-width="2" opacity="0.8"/>
  <path d="M52 438 H1228" stroke="url(#line)" stroke-width="2" opacity="0.55"/>
  <g opacity="0.14" stroke="#93c5fd">
    <path d="M96 130 H1184"/>
    <path d="M96 178 H1184"/>
    <path d="M96 226 H1184"/>
    <path d="M96 274 H1184"/>
    <path d="M96 322 H1184"/>
    <path d="M96 370 H1184"/>
  </g>
  <g transform="translate(72 116)">
    <rect width="452" height="292" rx="20" fill="#020617" stroke="#334155"/>
    <rect x="0.5" y="0.5" width="451" height="291" rx="19.5" fill="none" stroke="#0f172a"/>
    <circle cx="32" cy="30" r="7" fill="#ef4444"/>
    <circle cx="56" cy="30" r="7" fill="#f59e0b"/>
    <circle cx="80" cy="30" r="7" fill="#22c55e"/>
    <text x="30" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#67e8f9">$ agentkodex ask</text>
    <text x="30" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#e2e8f0">"Fix failing tests"</text>
    <text x="30" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#94a3b8">strategy: confidence 94%</text>
    <text x="30" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#94a3b8">agent: codex cli</text>
    <text x="30" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#94a3b8">gates: passed</text>
    <text x="30" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#34d399">winner returned</text>
  </g>
  <g transform="translate(584 118)">
    <text x="0" y="50" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="76" font-weight="800" fill="#f8fafc" filter="url(#soft)">AGENTKODEX</text>
    <text x="4" y="98" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" fill="#a5f3fc">Chat-first control plane for AI coding agents</text>
    <g transform="translate(4 142)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#dbeafe">
      <rect x="0" y="0" width="132" height="42" rx="10" fill="#0f172a" stroke="#38bdf8"/>
      <text x="31" y="27">Setup</text>
      <rect x="150" y="0" width="112" height="42" rx="10" fill="#0f172a" stroke="#34d399"/>
