      <rect x="194" y="0" width="174" height="42" rx="21" fill="#0f172a" stroke="#a78bfa"/>
      <text x="218" y="27">Agentguard</text>
      <rect x="386" y="0" width="152" height="42" rx="21" fill="#0f172a" stroke="#34d399"/>
