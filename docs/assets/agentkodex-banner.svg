  <g transform="translate(914 328)">
    <rect width="226" height="78" rx="14" fill="#020617" stroke="#475569"/>
    <text x="24" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#f8fafc">audit trail saved</text>
    <text x="24" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#34d399">cache + replay ready</text>
