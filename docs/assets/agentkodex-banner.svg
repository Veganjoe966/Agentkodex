  <g transform="translate(1010 320)" opacity="0.92">
    <rect x="0" y="0" width="192" height="82" rx="14" fill="#020617" stroke="#475569"/>
    <text x="24" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#f8fafc">audit verified</text>
    <text x="24" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#34d399">sha256 ok</text>
  </g>
