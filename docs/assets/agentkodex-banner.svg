<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="Agentkodex CLI-native agent operations runtime">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.48" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#07111a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="520" rx="34" fill="url(#bg)"/>
  <path d="M0 398 C180 320 285 470 454 386 C628 300 735 402 886 316 C1054 220 1130 282 1280 188 L1280 520 L0 520 Z" fill="#0f172a" opacity="0.68"/>
  <path d="M46 70 H1234" stroke="url(#edge)" stroke-width="2" opacity="0.75"/>
  <path d="M46 450 H1234" stroke="url(#edge)" stroke-width="2" opacity="0.55"/>
  <g opacity="0.2" stroke="#93c5fd">
    <path d="M122 116 H1150"/>
    <path d="M122 164 H1150"/>
    <path d="M122 212 H1150"/>
    <path d="M122 260 H1150"/>
    <path d="M122 308 H1150"/>
  </g>
  <g transform="translate(76 86)">
    <rect x="0" y="0" width="410" height="282" rx="18" fill="#030712" stroke="#334155"/>
    <circle cx="29" cy="28" r="7" fill="#ef4444"/>
    <circle cx="52" cy="28" r="7" fill="#f59e0b"/>
    <circle cx="75" cy="28" r="7" fill="#22c55e"/>
    <text x="28" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#67e8f9">$ agentkodex run</text>
    <text x="28" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#cbd5e1">runtime: v2 pty session</text>
    <text x="28" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#cbd5e1">capability: ed25519 ok</text>
    <text x="28" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#cbd5e1">quality: passed</text>
    <text x="28" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#cbd5e1">audit: bundle verified</text>
    <text x="28" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#34d399">status: controlled</text>
  </g>
  <g transform="translate(548 92)">
    <text x="0" y="52" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="78" font-weight="800" fill="#f8fafc" filter="url(#glow)">AGENTKODEX</text>
    <text x="4" y="100" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" fill="#a5f3fc">CLI-native control plane for coding agents</text>
    <g transform="translate(4 145)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#dbeafe">
      <rect x="0" y="0" width="176" height="42" rx="21" fill="#0f172a" stroke="#38bdf8"/>
