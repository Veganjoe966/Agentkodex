name: Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install

      - name: Release gate
        run: |
          npm run release:gate || {
            status=$?
            echo "::group::quality gate logs"
            for file in .agentkodex/quality-gate/*.log; do
              [ -f "$file" ] || continue
              echo "===== $file ====="
              tail -n 220 "$file"
            done
            echo "::endgroup::"
            exit "$status"
          }

      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-diagnostics
          path: |
            .agentkodex/quality-gate/*.log
            .agentkodex/quality-gate/*.json
          if-no-files-found: ignore
